<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning AVP — Impression</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#1f5fa8; --bleu-fonce:#16487f;
    --matin:#fff4e6; --matin-txt:#c2620f; --matin-bord:#f3ddc2;
    --aprem:#efeafe; --aprem-txt:#6d28d9; --aprem-bord:#dccdf7;
    --texte:#1a1a2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:#e8e8e8;color:var(--texte);padding:20px;}
  .controls{max-width:1100px;margin:0 auto 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .controls label{font-weight:700;font-size:14px;color:var(--bleu);}
  .controls select{padding:8px 14px;border:2px solid var(--bleu);border-radius:8px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--bleu);background:white;cursor:pointer;}
  .btn-print{margin-left:auto;padding:10px 24px;background:var(--bleu);color:white;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .btn-print:hover{background:var(--bleu-fonce);}
  .page{max-width:1100px;margin:0 auto 30px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
  .entete{background:var(--bleu);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .entete-titre{font-size:20px;font-weight:800;letter-spacing:0.3px;}
  .entete-sous{font-size:11px;opacity:0.9;margin-top:2px;}
  .entete-animateur{background:rgba(255,255,255,0.2);padding:7px 18px;border-radius:18px;font-size:13px;font-weight:800;text-align:center;line-height:1.25;}
  .entete-tel{font-size:12px;font-weight:700;opacity:0.95;margin-top:1px;letter-spacing:0.3px;}
  .grille{padding:10px;}
  .semaine{margin-bottom:8px;}
  .semaine-titre{display:none;}
  .jours-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .jour{border:1.5px solid #e3e8ef;border-radius:10px;overflow:hidden;min-height:70px;}
  .jour-header{background:var(--bleu);color:white;text-align:center;padding:5px 4px;}
  .jour-nom{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;}
  .jour-num{font-size:22px;font-weight:800;line-height:1.1;}
  .jour-vide .jour-header{background:#c3cdd9;}
  .jour-ferie .jour-header{background:#8a93a0;}
  .creneaux{padding:6px;display:flex;flex-direction:column;gap:6px;}
  .creneau{border-radius:9px;padding:7px 8px;background:#f3f5f8;display:flex;align-items:center;gap:8px;text-align:left;}
  .creneau-txt{flex:1;min-width:0;}
  .creneau-matin{background:var(--matin);}
  .creneau-aprem{background:var(--aprem);}
  .creneau-ico{font-size:26px;line-height:1;flex:0 0 auto;}
  .creneau-titre{font-size:14px;font-weight:800;color:var(--texte);line-height:1.15;}
  .creneau-heure{font-size:13px;font-weight:800;margin-top:1px;color:#555;}
  .creneau-matin .creneau-heure{color:var(--matin-txt);}
  .creneau-aprem .creneau-heure{color:var(--aprem-txt);}
  .jour-vide .creneaux,.jour-ferie .creneaux{display:flex;align-items:center;justify-content:center;min-height:60px;color:#aaa;font-size:11px;font-style:italic;}
  .pied{border-top:1.5px solid #eee;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#888;}
  .legende{display:flex;gap:16px;align-items:center;}
  .legende b{color:var(--bleu);}
  .legende > span{display:flex;align-items:center;gap:5px;}
  .pastille{width:14px;height:14px;border-radius:4px;display:inline-block;}
  .loading{text-align:center;padding:60px;font-size:16px;color:var(--bleu);font-weight:600;}
  .erreur{text-align:center;padding:40px;color:#c0392b;font-weight:600;}
  .avis-ecran{max-width:1100px;margin:0 auto 14px;background:#fdf0dc;color:#8a5a00;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;}
  @media print{
    @page{size:A4 landscape;margin:4mm;}
    /* Force l'impression des fonds colores (Chrome les supprime par defaut) */
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
    body{background:white;padding:0;margin:0;}
    .controls{display:none !important;}
    .avis-ecran{display:none !important;}
    .page{box-shadow:none;border-radius:0;margin:0;width:277mm;max-width:277mm;page-break-after:always;font-size:10px;}
    .page:last-child{page-break-after:avoid;}
    .entete{padding:7px 14px;}
    .entete-titre{font-size:19px;}
    .entete-sous{font-size:10px;}
    .entete-animateur{font-size:12px;padding:4px 12px;}
    .entete-tel{font-size:11px;}
    .grille{padding:5px;}
    .semaine{margin-bottom:5px;page-break-inside:avoid;break-inside:avoid;}
    .jours-row{gap:4px;}
    .jour{min-height:48px;}
    .jour-header{padding:3px 2px;}
    .jour-nom{font-size:11px;}
    .jour-num{font-size:20px;}
    .creneaux{padding:3px;gap:3px;}
    .creneau{padding:4px 5px;gap:5px;}
    .creneau-ico{font-size:20px;line-height:1;}
    .creneau-titre{font-size:14px;line-height:1.1;}
    .creneau-heure{font-size:12.5px;}
    .jour-vide .creneaux,.jour-ferie .creneaux{font-size:9px;min-height:0;}
    .pied{padding:4px 14px;font-size:9px;}
  }
</style>
</head>
<body>

<div class="controls">
  <label>Animateur :</label>
  <select id="selectAnimateur" onchange="chargerPlanning()">
    <option value="steve">📋 Planning Steve</option>
    <option value="greg">📋 Planning Greg</option>
    <option value="both">📄 Les deux (recto-verso)</option>
  </select>

  <label>Mois :</label>
  <select id="selectMois" onchange="chargerPlanning()">
    <option value="avril">Avril 2026</option>
    <option value="mai">Mai 2026</option>
    <option value="juin">Juin 2026</option>
    <option value="juillet">Juillet 2026</option>
    <option value="aout">Août 2026</option>
    <option value="septembre">Septembre 2026</option>
    <option value="octobre">Octobre 2026</option>
    <option value="novembre">Novembre 2026</option>
    <option value="decembre">Décembre 2026</option>
  </select>

  <button class="btn-print" id="btnImprimer" onclick="imprimer()">🖨️ Imprimer</button>
</div>

<div id="contenu">
  <div class="loading">⏳ Chargement du planning...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// URLs CSV des Sheets — à compléter pour Greg
const CSV_URLS = {
  steve: {
    avril:      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=382746303&single=true&output=csv",
    mai:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=506017650&single=true&output=csv",
    juin:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=1137601915&single=true&output=csv",
    juillet:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=1325311580&single=true&output=csv",
    aout:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=803134238&single=true&output=csv",
    septembre:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=1849419380&single=true&output=csv",
    octobre:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=1351412147&single=true&output=csv",
  },
  greg: {
    mai:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=506017650&single=true&output=csv",
    juin:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=723271460&single=true&output=csv",
    juillet:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=1325311580&single=true&output=csv",
    aout:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=803134238&single=true&output=csv",
    septembre:  "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=1849419380&single=true&output=csv",
    octobre:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=1351412147&single=true&output=csv",
  }
};

// Numeros de telephone affiches dans l'en-tete de chaque planning
const TELS = {
  steve: "06 46 63 24 30",
  greg:  "06 66 60 16 19"
};

// Noms des mois
const MOIS_NOMS = {
  avril: "Avril 2026", mai: "Mai 2026", juin: "Juin 2026",
  juillet: "Juillet 2026", aout: "Août 2026", septembre: "Septembre 2026",
  octobre: "Octobre 2026", novembre: "Novembre 2026", decembre: "Décembre 2026"
};

// Recupere un CSV directement, en contournant le cache
function fetchCSV(url) {
  return fetch(url + '&_=' + Date.now(), { cache: 'no-store' }).then(r => r.text());
}

// ===== Planning saisi dans l'appli (page pro) =====
// Un mois PUBLIÉ dans l'appli remplace le Google Sheet pour cet animateur ; sinon on lit le Sheet comme avant.
const MOIS_NUM = { avril:4, mai:5, juin:6, juillet:7, aout:8, septembre:9, octobre:10, novembre:11, decembre:12 };
const ANNEE = 2026;
const APPLI_ANIMS = ['steve'];   // animateurs dont le planning peut être saisi dans l'appli (comme dans l'appli bénéficiaires)
let _db = null;
function getDb() {
  if (_db) return _db;
  firebase.initializeApp({
    apiKey: "AIzaSyCF1JkJDjW6vtoGoKZQrTbe0kWy1p45Uqg",
    authDomain: "majourneeavp.firebaseapp.com",
    projectId: "majourneeavp",
    storageBucket: "majourneeavp.firebasestorage.app",
    messagingSenderId: "462434472591",
    appId: "1:462434472591:web:300522e541df2ce1ae96fa"
  });
  _db = firebase.firestore();
  return _db;
}
function p2(n) { return (n < 10 ? '0' : '') + n; }
function escHtml(t) { return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function fmtH(t) { const p = String(t || '').split(':'); const h = parseInt(p[0], 10); return h + 'h' + (p[1] && p[1] !== '00' ? p[1] : ''); }

// Liste des ateliers du mois si ce mois est publié dans l'appli, sinon null (=> Google Sheet)
async function lireAppli(a, mois) {
  if (!APPLI_ANIMS.includes(a) || typeof firebase === 'undefined') return null;
  const num = MOIS_NUM[mois];
  if (!num) return null;
  const db = getDb();
  const label = (a === 'steve') ? 'Steve' : 'Greg';
  const ym = ANNEE + '-' + p2(num);
  const cfg = await db.collection('config').doc('planningApp').get();
  const publies = (cfg.exists && cfg.data().publies) || {};
  if (!publies[label + '_' + ym.replace('-', '_')]) return null;
  const snap = await db.collection('planning').where('anim', '==', label).get();
  return snap.docs.map(d => d.data()).filter(d => d.ym === ym);
}

// Jours fériés français (jour fixe + Pâques) : affichés « Jour férié » quand aucun atelier n'est prévu ce jour-là
function joursFeries(y) {
  const s = new Set();
  const add = (m, d) => s.add(y + '-' + p2(m) + '-' + p2(d));
  add(1, 1); add(5, 1); add(5, 8); add(7, 14); add(8, 15); add(11, 1); add(11, 11); add(12, 25);
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const moisP = Math.floor((h + l - 7 * m + 114) / 31), jourP = ((h + l - 7 * m + 114) % 31) + 1;
  const paques = new Date(y, moisP - 1, jourP);
  [1, 39, 50].forEach(n => { const x = new Date(paques.getFullYear(), paques.getMonth(), paques.getDate() + n); add(x.getMonth() + 1, x.getDate()); });
  return s;
}

// Construit les semaines (lundi à vendredi) d'un mois à partir des ateliers saisis dans l'appli
function construirePlanningAppli(docs, animateur, mois) {
  const num = MOIS_NUM[mois];
  const feries = joursFeries(ANNEE);
  const noms = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
  const nbJours = new Date(ANNEE, num, 0).getDate();
  const semaines = [];
  let cur = null;
  for (let d = 1; d <= nbJours; d++) {
    const wd = new Date(ANNEE, num - 1, d).getDay();   // 0 = dimanche … 6 = samedi
    if (wd === 0 || wd === 6) continue;
    if (wd === 1 || !cur) { cur = { jours: [] }; semaines.push(cur); }
    const iso = ANNEE + '-' + p2(num) + '-' + p2(d);
    const du = docs.filter(x => x.date === iso).sort((x, y) => String(x.time).localeCompare(String(y.time)));
    const jour = { nom: noms[wd - 1], num: d, col: 0, creneaux: [], ferie: false };
    du.forEach(x => {
      jour.creneaux.push({
        heure: fmtH(x.time) + (x.fin ? ' – ' + fmtH(x.fin) : '') + (x.reserve ? ' · 🔒 réservé' : ''),
        activite: x.title,
        titre: escHtml(x.title),
        emoji: escHtml(x.icon || '📋'),
        periode: parseInt(String(x.time || '0').slice(0, 2), 10) < 12 ? 'Matin' : 'Après-midi'
      });
    });
    if (!du.length && feries.has(iso)) jour.ferie = true;
    cur.jours.push(jour);
  }
  return rendreSemaines(semaines, animateur, mois);
}

let _requete = 0;
async function chargerPlanning() {
  const moi = ++_requete;
  const animateur = document.getElementById('selectAnimateur').value;
  const mois = document.getElementById('selectMois').value;
  const cible = document.getElementById('contenu');

  // "both" = Steve puis Greg, dans cet ordre (page 1 = recto / page 2 = verso)
  const liste = (animateur === 'both') ? ['steve', 'greg'] : [animateur];
  const nom = a => (a === 'steve') ? 'Steve' : 'Greg';

  cible.innerHTML = '<div class="loading">⏳ Chargement...</div>';

  // Pour chaque animateur : mois publié dans l'appli, sinon Google Sheet, sinon rien
  const sources = [];
  for (const a of liste) {
    let docs = null;
    try { docs = await lireAppli(a, mois); } catch (e) { docs = null; }
    if (docs) sources.push({ a: a, type: 'appli', docs: docs });
    else if ((CSV_URLS[a] || {})[mois]) sources.push({ a: a, type: 'csv' });
    else sources.push({ a: a, type: 'absent' });
  }
  if (moi !== _requete) return;

  const dispo = sources.filter(s => s.type !== 'absent');
  const absents = sources.filter(s => s.type === 'absent').map(s => nom(s.a));
  if (!dispo.length) {
    cible.innerHTML = `<div class="erreur">⚠️ Ce planning n'est pas encore disponible.<br>${absents.join(' et ')} : rien de publié dans l'appli et pas de Google Sheet pour ce mois.</div>`;
    return;
  }

  Promise.all(dispo.map(s => s.type === 'appli'
      ? Promise.resolve(construirePlanningAppli(s.docs, s.a, mois))
      : fetchCSV(CSV_URLS[s.a][mois]).then(csv => construirePlanning(csv, s.a, mois))))
    .then(pages => {
      if (moi !== _requete) return;
      let html = '';
      if (absents.length) {
        html += `<div class="avis-ecran">⚠️ Pas de planning pour ${absents.join(' et ')} ce mois-ci : seule la page de ${dispo.map(s => nom(s.a)).join(' et ')} sera imprimée.</div>`;
      }
      cible.innerHTML = html + pages.join('');
    })
    .catch(() => {
      if (moi !== _requete) return;
      cible.innerHTML = `<div class="erreur">❌ Impossible de charger le planning.<br>Vérifie que le Sheet est bien publié en CSV.</div>`;
    });
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  return lines.map(line => {
    const cols = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
      else { current += c; }
    }
    cols.push(current.trim());
    return cols;
  });
}

function nettoyer(txt) {
  if (!txt) return '';
  // Garder les emojis, juste nettoyer les espaces
  return txt.trim();
}

// Construit et RETOURNE le HTML d'un planning (permet d'en empiler plusieurs)
function construirePlanning(csv, animateur, mois) {
  const rows = parseCSV(csv);
  const nomErr = (animateur === 'steve') ? 'Steve' : 'Greg';
  if (!rows || rows.length < 3) {
    return '<div class="erreur">❌ Données CSV vides ou incorrectes (planning ' + nomErr + ').</div>';
  }

  // Titre depuis ligne 1
  const titreMois = MOIS_NOMS[mois] || mois;
  const nomAnimateur = animateur === 'steve' ? 'Steve' : 'Greg';

  // Parser la structure du Sheet AVP
  // Structure : colonnes par paires (Heure, Activité) pour chaque jour
  // Lignes : semaines avec en-têtes de jours

  const semaines = [];
  let semaineCourante = null;
  const joursNoms = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const cell0 = (row[0] || '').trim();

    // Ligne de semaine (contient "Lundi X")
    if (cell0 === '' && row.some(c => /^Lundi\s+\d/.test(c))) {
      semaineCourante = { jours: [] };
      semaines.push(semaineCourante);

      // Extraire les jours et leurs numéros
      for (let j = 0; j < row.length; j++) {
        const val = (row[j] || '').trim();
        const matchJour = val.match(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi)\s+(\d+)$/);
        if (matchJour) {
          semaineCourante.jours.push({
            nom: matchJour[1],
            num: parseInt(matchJour[2]),
            col: j,
            creneaux: [],
            ferie: false
          });
        }
      }
      continue;
    }

    // Lignes Matin / Après-midi
    if (semaineCourante && (cell0 === 'Matin' || cell0 === 'Après-midi' || /matin/i.test(cell0) || /apr/i.test(cell0))) {
      const periode = /matin/i.test(cell0) ? 'Matin' : 'Après-midi';
      
      // Récupérer heure et activité pour chaque jour
      semaineCourante.jours.forEach(jour => {
        const colHeure = jour.col;
        const colActiv = jour.col + 1;
        const heure = (row[colHeure] || '').trim();
        const activite = nettoyer((row[colActiv] || '').trim());

        if (activite && activite !== '-' && activite !== '') {
          // Vérifier si férié
          if (/f[eé]ri[eé]/i.test(activite)) {
            jour.ferie = true;
          } else {
            jour.creneaux.push({ heure, activite, periode });
          }
        } else if (/f[eé]ri[eé]/i.test(heure)) {
          jour.ferie = true;
        }
      });
      continue;
    }

    // Lignes de données supplémentaires (2ème créneau du matin/après-midi)
    if (semaineCourante && cell0 === '') {
      semaineCourante.jours.forEach(jour => {
        const colHeure = jour.col;
        const colActiv = jour.col + 1;
        const heure = (row[colHeure] || '').trim();
        const activite = nettoyer((row[colActiv] || '').trim());
        if (activite && activite !== '-' && activite !== '' && heure) {
          jour.creneaux.push({ heure, activite, periode: '' });
        }
      });
    }

    // Mercredi 1, Jeudi 2, Vendredi 3 (début de mois décalé)
    if (cell0 === '' && row.some(c => /^(Mardi|Mercredi|Jeudi|Vendredi)\s+\d/.test(c))) {
      if (!semaineCourante) {
        semaineCourante = { jours: [] };
        semaines.push(semaineCourante);
      }
      for (let j = 0; j < row.length; j++) {
        const val = (row[j] || '').trim();
        const matchJour = val.match(/^(Mardi|Mercredi|Jeudi|Vendredi)\s+(\d+)$/);
        if (matchJour && !semaineCourante.jours.find(d => d.num === parseInt(matchJour[2]))) {
          semaineCourante.jours.push({
            nom: matchJour[1],
            num: parseInt(matchJour[2]),
            col: j,
            creneaux: [],
            ferie: false
          });
        }
      }
    }
  }

  return rendreSemaines(semaines, animateur, mois);
}

// Construit le HTML d'un planning à partir des semaines (que les données viennent du Sheet ou de l'appli)
function rendreSemaines(semaines, animateur, mois) {
  const titreMois = MOIS_NOMS[mois] || mois;
  const nomAnimateur = animateur === 'steve' ? 'Steve' : 'Greg';
  function extraireEmoji(txt){
    txt=(txt||'').trim();
    const m=txt.match(/^((?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u2300-\u23FF]|\uFE0F|\u200D)+)/);
    if(m){const emoji=m[1].trim();const titre=txt.slice(m[0].length).trim();return {emoji:emoji,titre:titre||txt};}
    return {emoji:'',titre:txt};
  }
  let html = `
  <div class="page">
    <div class="entete">
      <div>
        <div class="entete-titre">📅 Planning ${titreMois}</div>
        <div class="entete-sous">Service AVP — Aide à la Vie Partagée | AVP La Clé, Rouen</div>
      </div>
      <div class="entete-animateur">👤 Animateur : ${nomAnimateur}${TELS[animateur] ? `<div class="entete-tel">📞 ${TELS[animateur]}</div>` : ''}</div>
    </div>
    <div class="grille">`;

  const joursOrdre = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];

  semaines.forEach((semaine, idx) => {
    const joursParNom = {};
    semaine.jours.forEach(j => joursParNom[j.nom] = j);

    html += `<div class="semaine">`;
    if (idx > 0 || semaine.jours.length > 0) {
      const nums = semaine.jours.map(j => j.num).sort((a,b) => a-b);
      html += `<div class="semaine-titre">Semaine du ${nums[0]} au ${nums[nums.length-1]} ${titreMois.split(' ')[0]}</div>`;
    }
    html += `<div class="jours-row">`;

    joursOrdre.forEach(nomJour => {
      const jour = joursParNom[nomJour];
      if (!jour) {
        // Jour absent (début/fin de mois)
        html += `<div class="jour jour-vide">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">—</div></div>
          <div class="creneaux" style="color:#ddd;font-size:10px;text-align:center;padding:10px;">-</div>
        </div>`;
      } else if (jour.ferie) {
        html += `<div class="jour jour-ferie">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">${jour.num}</div></div>
          <div class="creneaux" style="color:#999;font-size:11px;text-align:center;padding:10px;">🎌 Jour férié</div>
        </div>`;
      } else {
        html += `<div class="jour">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">${jour.num}</div></div>
          <div class="creneaux">`;
        
        if (jour.creneaux.length === 0) {
          html += `<div style="color:#bbb;font-size:10px;text-align:center;padding:8px 0;">Pas d'atelier</div>`;
        } else {
          jour.creneaux.forEach(c => {
            const _e = (c.titre !== undefined) ? { emoji: c.emoji, titre: c.titre } : extraireEmoji(c.activite);
            const _cls = /matin/i.test(c.periode) ? 'creneau creneau-matin' : (/apr/i.test(c.periode) ? 'creneau creneau-aprem' : 'creneau');
            html += `<div class="${_cls}">
              <div class="creneau-txt">
                <div class="creneau-titre">${_e.titre}</div>
                ${c.heure ? `<div class="creneau-heure">${c.heure}</div>` : ''}
              </div>
              <div class="creneau-ico">${_e.emoji || '📋'}</div>
            </div>`;
          });
        }
        html += `</div></div>`;
      }
    });

    html += `</div></div>`;
  });

  html += `</div>
    <div class="pied">
      <span class="legende"><b>Repères :</b><span><span class="pastille" style="background:#fff4e6;border:1px solid #f3ddc2;"></span> Matin</span><span><span class="pastille" style="background:#efeafe;border:1px solid #dccdf7;"></span> Après-midi</span></span>
      <span>Imprimé le ${new Date().toLocaleDateString('fr-FR')}</span>
    </div>
  </div>`;

  return html;
}

// Dans l'appli Android (APK), l'impression ne marche pas : le bouton ouvre cette même page dans le
// navigateur du téléphone (Chrome), où l'on peut imprimer. Le lien en http:// est envoyé par l'APK vers le
// navigateur (adresse différente de celle de l'appli) ; GitHub le repasse aussitôt en https.
function dansAppli() {
  try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) { return false; }
}
function imprimer() {
  if (dansAppli()) {
    const a = document.getElementById('selectAnimateur').value;
    const m = document.getElementById('selectMois').value;
    window.location.href = 'http://stevoux1969.github.io/planning-print.html?anim=' + encodeURIComponent(a) + '&mois=' + encodeURIComponent(m);
    return;
  }
  window.print();
}

// Pré-sélection depuis le lien (ex. bouton « Imprimer le planning » de l'appli : ?anim=both&mois=novembre)
(function () {
  try {
    const q = new URLSearchParams(location.search);
    const choisir = (id, v) => { const sel = document.getElementById(id); if (v && [...sel.options].some(o => o.value === v)) sel.value = v; };
    choisir('selectAnimateur', q.get('anim'));
    choisir('selectMois', q.get('mois'));
  } catch (e) {}
  if (dansAppli()) document.getElementById('btnImprimer').textContent = '🖨️ Imprimer (ouvre Chrome)';
})();

// Chargement initial
chargerPlanning();
</script>
