<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning AVP — Impression</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#1f5fa8; --bleu-fonce:#16487f;
    --matin:#fff4e6; --matin-txt:#c2620f; --matin-bord:#f3ddc2;
    --aprem:#efeafe; --aprem-txt:#6d28d9; --aprem-bord:#dccdf7;
    --texte:#1a1a2e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Nunito',sans-serif;background:#e8e8e8;color:var(--texte);padding:20px;}
  .controls{max-width:1100px;margin:0 auto 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
  .controls label{font-weight:700;font-size:14px;color:var(--bleu);}
  .controls select{padding:8px 14px;border:2px solid var(--bleu);border-radius:8px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;color:var(--bleu);background:white;cursor:pointer;}
  .btn-print{margin-left:auto;padding:10px 24px;background:var(--bleu);color:white;border:none;border-radius:8px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;}
  .btn-print:hover{background:var(--bleu-fonce);}
  .page{max-width:1100px;margin:0 auto 30px;background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
  .entete{background:var(--bleu);color:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .entete-titre{font-size:20px;font-weight:800;letter-spacing:0.3px;}
  .entete-sous{font-size:11px;opacity:0.9;margin-top:2px;}
  .entete-animateur{background:rgba(255,255,255,0.2);padding:8px 18px;border-radius:20px;font-size:13px;font-weight:800;}
  .grille{padding:10px;}
  .semaine{margin-bottom:8px;}
  .semaine-titre{display:none;}
  .jours-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .jour{border:1.5px solid #e3e8ef;border-radius:10px;overflow:hidden;min-height:70px;}
  .jour-header{background:var(--bleu);color:white;text-align:center;padding:5px 4px;}
  .jour-nom{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;}
  .jour-num{font-size:22px;font-weight:800;line-height:1.1;}
  .jour-vide .jour-header{background:#c3cdd9;}
  .jour-ferie .jour-header{background:#8a93a0;}
  .creneaux{padding:6px;display:flex;flex-direction:column;gap:6px;}
  .creneau{border-radius:9px;padding:7px 6px;text-align:center;background:#f3f5f8;}
  .creneau-matin{background:var(--matin);}
  .creneau-aprem{background:var(--aprem);}
  .creneau-ico{font-size:24px;line-height:1;}
  .creneau-titre{font-size:13px;font-weight:800;color:var(--texte);margin-top:3px;line-height:1.15;}
  .creneau-heure{font-size:12px;font-weight:800;margin-top:2px;color:#555;}
  .creneau-matin .creneau-heure{color:var(--matin-txt);}
  .creneau-aprem .creneau-heure{color:var(--aprem-txt);}
  .jour-vide .creneaux,.jour-ferie .creneaux{display:flex;align-items:center;justify-content:center;min-height:60px;color:#aaa;font-size:11px;font-style:italic;}
  .pied{border-top:1.5px solid #eee;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#888;}
  .legende{display:flex;gap:16px;align-items:center;}
  .legende b{color:var(--bleu);}
  .legende > span{display:flex;align-items:center;gap:5px;}
  .pastille{width:14px;height:14px;border-radius:4px;display:inline-block;}
  .loading{text-align:center;padding:60px;font-size:16px;color:var(--bleu);font-weight:600;}
  .erreur{text-align:center;padding:40px;color:#c0392b;font-weight:600;}
  @media print{
    @page{size:A4 landscape;margin:5mm;}
    body{background:white;padding:0;margin:0;}
    .controls{display:none !important;}
    .page{box-shadow:none;border-radius:0;margin:0;width:277mm;max-width:277mm;page-break-after:always;font-size:10px;}
    .page:last-child{page-break-after:avoid;}
    .entete{padding:8px 14px;}
    .entete-titre{font-size:15px;}
    .entete-sous{font-size:9px;}
    .entete-animateur{font-size:10px;padding:4px 10px;}
    .grille{padding:6px;}
    .semaine{margin-bottom:5px;}
    .jours-row{gap:4px;}
    .jour{min-height:50px;}
    .jour-header{padding:3px 2px;}
    .jour-nom{font-size:9px;}
    .jour-num{font-size:16px;}
    .creneaux{padding:3px;gap:3px;}
    .creneau{padding:4px 4px;}
    .creneau-ico{font-size:18px;}
    .creneau-titre{font-size:10px;line-height:1.2;}
    .creneau-heure{font-size:9px;}
    .pied{padding:4px 14px;font-size:8px;}
  }
</style>
</head>
<body>

<div class="controls">
  <label>Animateur :</label>
  <select id="selectAnimateur" onchange="chargerPlanning()">
    <option value="steve">📋 Planning Steve</option>
    <option value="greg">📋 Planning Greg</option>
  </select>

  <label>Mois :</label>
  <select id="selectMois" onchange="chargerPlanning()">
    <option value="avril">Avril 2026</option>
    <option value="mai">Mai 2026</option>
    <option value="juin">Juin 2026</option>
    <option value="juillet">Juillet 2026</option>
    <option value="aout">Août 2026</option>
    <option value="septembre">Septembre 2026</option>
    <option value="octobre">Octobre 2026</option>
    <option value="novembre">Novembre 2026</option>
    <option value="decembre">Décembre 2026</option>
  </select>

  <button class="btn-print" onclick="window.print()">🖨️ Imprimer</button>
</div>

<div id="contenu">
  <div class="loading">⏳ Chargement du planning...</div>
</div>

<script>
// URLs CSV des Sheets — à compléter pour Greg
const CSV_URLS = {
  steve: {
    avril:      "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=382746303&single=true&output=csv",
    mai:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=506017650&single=true&output=csv",
    juin:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiMQSY5bkzgEsLV58rkPeAxuAffVuw0qPuehrTL_92BdlYDgL_QMjHZTzd5KF_IhhPm3pfmQJsXB7T/pub?gid=1137601915&single=true&output=csv",
  },
  greg: {
    mai:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=506017650&single=true&output=csv",
    juin:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVyCIhrJco50xlQhnGeJ3wDpxvu-h5ZzHyN5Z-GrHb8ekkwtobyKxFFXevdr1QDDk4wZo-mtyirB8y/pub?gid=723271460&single=true&output=csv",
  }
};

// Noms des mois
const MOIS_NOMS = {
  avril: "Avril 2026", mai: "Mai 2026", juin: "Juin 2026",
  juillet: "Juillet 2026", aout: "Août 2026", septembre: "Septembre 2026",
  octobre: "Octobre 2026", novembre: "Novembre 2026", decembre: "Décembre 2026"
};

function chargerPlanning() {
  const animateur = document.getElementById('selectAnimateur').value;
  const mois = document.getElementById('selectMois').value;
  const url = (CSV_URLS[animateur] || {})[mois];

  if (!url) {
    document.getElementById('contenu').innerHTML = `<div class="erreur">⚠️ Ce planning n'est pas encore disponible.<br>Ajoute l'URL CSV pour ${animateur} / ${mois}.</div>`;
    return;
  }

  document.getElementById('contenu').innerHTML = '<div class="loading">⏳ Chargement...</div>';

  const proxy = "https://corsproxy.io/?" + encodeURIComponent(url);
  fetch(proxy)
    .then(r => r.text())
    .then(csv => afficherPlanning(csv, animateur, mois))
    .catch(() => {
      // Fallback direct
      fetch(url)
        .then(r => r.text())
        .then(csv => afficherPlanning(csv, animateur, mois))
        .catch(e => {
          document.getElementById('contenu').innerHTML = `<div class="erreur">❌ Impossible de charger le planning.<br>Vérifie que le Sheet est bien publié en CSV.</div>`;
        });
    });
}

function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  return lines.map(line => {
    const cols = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes) { cols.push(current.trim()); current = ''; }
      else { current += c; }
    }
    cols.push(current.trim());
    return cols;
  });
}

function nettoyer(txt) {
  if (!txt) return '';
  // Garder les emojis, juste nettoyer les espaces
  return txt.trim();
}

function afficherPlanning(csv, animateur, mois) {
  const rows = parseCSV(csv);
  if (!rows || rows.length < 3) {
    document.getElementById('contenu').innerHTML = '<div class="erreur">❌ Données CSV vides ou incorrectes.</div>';
    return;
  }

  // Titre depuis ligne 1
  const titreMois = MOIS_NOMS[mois] || mois;
  const nomAnimateur = animateur === 'steve' ? 'Steve' : 'Greg';

  // Parser la structure du Sheet AVP
  // Structure : colonnes par paires (Heure, Activité) pour chaque jour
  // Lignes : semaines avec en-têtes de jours

  const semaines = [];
  let semaineCourante = null;
  const joursNoms = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];

  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const cell0 = (row[0] || '').trim();

    // Ligne de semaine (contient "Lundi X")
    if (cell0 === '' && row.some(c => /^Lundi\s+\d/.test(c))) {
      semaineCourante = { jours: [] };
      semaines.push(semaineCourante);

      // Extraire les jours et leurs numéros
      for (let j = 0; j < row.length; j++) {
        const val = (row[j] || '').trim();
        const matchJour = val.match(/^(Lundi|Mardi|Mercredi|Jeudi|Vendredi)\s+(\d+)$/);
        if (matchJour) {
          semaineCourante.jours.push({
            nom: matchJour[1],
            num: parseInt(matchJour[2]),
            col: j,
            creneaux: [],
            ferie: false
          });
        }
      }
      continue;
    }

    // Lignes Matin / Après-midi
    if (semaineCourante && (cell0 === 'Matin' || cell0 === 'Après-midi' || /matin/i.test(cell0) || /apr/i.test(cell0))) {
      const periode = /matin/i.test(cell0) ? 'Matin' : 'Après-midi';
      
      // Récupérer heure et activité pour chaque jour
      semaineCourante.jours.forEach(jour => {
        const colHeure = jour.col;
        const colActiv = jour.col + 1;
        const heure = (row[colHeure] || '').trim();
        const activite = nettoyer((row[colActiv] || '').trim());

        if (activite && activite !== '-' && activite !== '') {
          // Vérifier si férié
          if (/f[eé]ri[eé]/i.test(activite)) {
            jour.ferie = true;
          } else {
            jour.creneaux.push({ heure, activite, periode });
          }
        } else if (/f[eé]ri[eé]/i.test(heure)) {
          jour.ferie = true;
        }
      });
      continue;
    }

    // Lignes de données supplémentaires (2ème créneau du matin/après-midi)
    if (semaineCourante && cell0 === '') {
      semaineCourante.jours.forEach(jour => {
        const colHeure = jour.col;
        const colActiv = jour.col + 1;
        const heure = (row[colHeure] || '').trim();
        const activite = nettoyer((row[colActiv] || '').trim());
        if (activite && activite !== '-' && activite !== '' && heure) {
          jour.creneaux.push({ heure, activite, periode: '' });
        }
      });
    }

    // Mercredi 1, Jeudi 2, Vendredi 3 (début de mois décalé)
    if (cell0 === '' && row.some(c => /^(Mercredi|Jeudi|Vendredi)\s+\d/.test(c))) {
      if (!semaineCourante) {
        semaineCourante = { jours: [] };
        semaines.push(semaineCourante);
      }
      for (let j = 0; j < row.length; j++) {
        const val = (row[j] || '').trim();
        const matchJour = val.match(/^(Mercredi|Jeudi|Vendredi)\s+(\d+)$/);
        if (matchJour && !semaineCourante.jours.find(d => d.num === parseInt(matchJour[2]))) {
          semaineCourante.jours.push({
            nom: matchJour[1],
            num: parseInt(matchJour[2]),
            col: j,
            creneaux: [],
            ferie: false
          });
        }
      }
    }
  }

  // Construire le HTML
  function extraireEmoji(txt){
    txt=(txt||'').trim();
    const m=txt.match(/^((?:[\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|[\u2300-\u23FF]|\uFE0F|\u200D)+)/);
    if(m){const emoji=m[1].trim();const titre=txt.slice(m[0].length).trim();return {emoji:emoji,titre:titre||txt};}
    return {emoji:'',titre:txt};
  }
  let html = `
  <div class="page">
    <div class="entete">
      <div>
        <div class="entete-titre">📅 Planning ${titreMois}</div>
        <div class="entete-sous">Service AVP — Aide à la Vie Partagée | AVP La Clé, Rouen</div>
      </div>
      <div class="entete-animateur">👤 Animateur : ${nomAnimateur}</div>
    </div>
    <div class="grille">`;

  const joursOrdre = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];

  semaines.forEach((semaine, idx) => {
    const joursParNom = {};
    semaine.jours.forEach(j => joursParNom[j.nom] = j);

    html += `<div class="semaine">`;
    if (idx > 0 || semaine.jours.length > 0) {
      const nums = semaine.jours.map(j => j.num).sort((a,b) => a-b);
      html += `<div class="semaine-titre">Semaine du ${nums[0]} au ${nums[nums.length-1]} ${titreMois.split(' ')[0]}</div>`;
    }
    html += `<div class="jours-row">`;

    joursOrdre.forEach(nomJour => {
      const jour = joursParNom[nomJour];
      if (!jour) {
        // Jour absent (début/fin de mois)
        html += `<div class="jour jour-vide">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">—</div></div>
          <div class="creneaux" style="color:#ddd;font-size:10px;text-align:center;padding:10px;">-</div>
        </div>`;
      } else if (jour.ferie) {
        html += `<div class="jour jour-ferie">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">${jour.num}</div></div>
          <div class="creneaux" style="color:#999;font-size:11px;text-align:center;padding:10px;">🎌 Jour férié</div>
        </div>`;
      } else {
        html += `<div class="jour">
          <div class="jour-header"><div class="jour-nom">${nomJour}</div><div class="jour-num">${jour.num}</div></div>
          <div class="creneaux">`;
        
        if (jour.creneaux.length === 0) {
          html += `<div style="color:#bbb;font-size:10px;text-align:center;padding:8px 0;">Pas d'atelier</div>`;
        } else {
          jour.creneaux.forEach(c => {
            const _e = extraireEmoji(c.activite);
            const _cls = /matin/i.test(c.periode) ? 'creneau creneau-matin' : (/apr/i.test(c.periode) ? 'creneau creneau-aprem' : 'creneau');
            html += `<div class="${_cls}">
              <div class="creneau-ico">${_e.emoji || '📋'}</div>
              <div class="creneau-titre">${_e.titre}</div>
              ${c.heure ? `<div class="creneau-heure">${c.heure}</div>` : ''}
            </div>`;
          });
        }
        html += `</div></div>`;
      }
    });

    html += `</div></div>`;
  });

  html += `</div>
    <div class="pied">
      <span class="legende"><b>Repères :</b><span><span class="pastille" style="background:#fff4e6;border:1px solid #f3ddc2;"></span> Matin</span><span><span class="pastille" style="background:#efeafe;border:1px solid #dccdf7;"></span> Après-midi</span></span>
      <span>Imprimé le ${new Date().toLocaleDateString('fr-FR')}</span>
    </div>
  </div>`;

  document.getElementById('contenu').innerHTML = html;
}

// Chargement initial
chargerPlanning();
</script>
</body>
</html>
